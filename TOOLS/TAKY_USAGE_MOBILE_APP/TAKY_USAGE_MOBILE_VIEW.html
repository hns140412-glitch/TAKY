<!DOCTYPE html>
<html lang="ko"><head><base target="_top">
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202834;background:#f4f5f7;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:18px;max-width:900px;margin-inline:auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:8px}
h1{font-size:21px;margin:0}h2{font-size:16px;margin:0 0 12px}
#status{font-size:12px;color:#626b76;margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:9px 0;border-radius:9px;border:1px solid #ccd2dc;background:white;font-weight:700}
.tab[aria-selected="true"]{background:#3c668b;color:white;border-color:#3c668b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:12px}
.card{background:white;border:1px solid #e2e5e9;border-radius:13px;padding:16px;min-height:100px}
.meta{font-size:12px;color:#687484}.line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:10px}
.label{font-size:13px;overflow-wrap:anywhere}.value{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.track{height:6px;border-radius:6px;background:#edf0f3;overflow:hidden;margin-top:5px}
.fill{height:100%;background:#3c668b;border-radius:6px}.fill.hot{background:#b5651d}.fill.crit{background:#a12f30}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;padding:4px 8px;border-radius:12px;background:#edf0f3}
.item{border-top:1px solid #edf0f3;padding:8px 0}.item:first-of-type{border-top:0}
.item b{font-size:13px}.item div{font-size:12px;color:#687484;margin-top:2px}
button{background:white;border:1px solid #ccd2dc;padding:8px 12px;min-height:44px;border-radius:9px;cursor:pointer;font-weight:600}
.warn{color:#a05f11!important}.error{color:#a12f30!important}footer{padding-top:14px;font-size:12px;color:#626b76}
</style></head><body>
<header><h1>TAKY AI 사용량</h1><button onclick="load()">새로고침</button></header>
<nav class="tabs" role="tablist" aria-label="화면 선택"><button class="tab" id="tabUsage" role="tab" aria-controls="list" aria-selected="true" onclick="show('usage')">사용량</button>
<button class="tab" id="tabControl" role="tab" aria-controls="control" aria-selected="false" onclick="show('control')">관제판</button></nav>
<div id="status" role="status" aria-live="polite">사용량 확인 중…</div><main class="grid" id="list" role="tabpanel" aria-labelledby="tabUsage"></main><main class="grid" id="control" role="tabpanel" aria-labelledby="tabControl" hidden></main>
<footer>사용률과 잔여율을 구분합니다. 미관측 값은 0%가 아닌 '미확인'으로 표시합니다. 관제판은 읽기 전용 시험 자료입니다.</footer>
<script>
const $=id=>document.getElementById(id);
const HIDDEN=['ChatGPT 웹/앱','Antigravity'];
const time=s=>{if(!s)return ''; const d=new Date(s);return Number.isNaN(d.getTime())?'':d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});};
const pct=x=>typeof x==='number'&&x>=0&&x<=100?x.toFixed(1)+'%':'미확인';
const num=(x,u)=>typeof x==='number'?x+(u||''):'미확인';
function el(tag,cls,text){const e=document.createElement(tag); if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function bar(card,num,warn,crit){
  if(typeof num==='number'&&num>=0&&num<=100){const b=el('div','track'),f=el('div','fill'+(crit&&num>=crit?' crit':warn&&num>=warn?' hot':''));f.style.width=num+'%';b.append(f);card.append(b);}
}
function meter(card,label,v,kind){
  const isRemain=kind==='remaining';const n=v&&(isRemain?v.remainingPercent:v.usedPercent);
  const row=el('div','line');row.append(el('span','label',label),el('span','value',pct(n)));card.append(row);
  bar(card,n);
  if(v&&v.resetAt)card.append(el('div','meta','초기화: '+time(v.resetAt)));
}
let tab='usage',last=null;
function show(t){
  tab=t;$('tabUsage').setAttribute('aria-selected',String(t==='usage'));$('tabControl').setAttribute('aria-selected',String(t==='control'));
  $('list').hidden=t!=='usage';$('control').hidden=t!=='control';
  if(last)status(last);
}
function status(answer){
  const s=$('status');
  if(!answer||!answer.ok){s.className='error';s.textContent='Drive 연동 미완료 또는 스냅샷 읽기 실패';return;}
  const d=answer.data,okay=answer.synchronized,direct=answer.source==='LIVE_PC';
  if(tab==='control'){
    const c=d.controlCenter;
    const st=!c?'관제판 자료 없음 (PC 동기화 미적용)':c.state==='OK'?'관제판 정상 수집':c.state==='PARTIAL'?'관제판 일부만 수집':'관제판 연결 불가';
    s.className=c&&c.state==='OK'&&okay?'':'warn';
    s.textContent=st+(okay?' · 자료 갱신 최근':' · 자료 갱신 지연')+(c&&c.observedAt?' | 수집: '+time(c.observedAt):'');
    return;
  }
  const monitored=(d.providers||[]).filter(p=>['Claude Code','Codex CLI','ElevenLabs'].includes(p.name));
  const stale=monitored.filter(p=>p.fresh!==true).map(p=>p.name);
  s.className=(direct&&okay&&stale.length===0)?'':'warn';
  s.textContent=(direct?'PC 직접 응답':'PC 연결 불가 · 마지막 저장 자료')+
    (okay?' · 자료 갱신 최근':' · 자료 갱신 지연')+
    (stale.length?' · 사용량 자체 지연/미확인: '+stale.join(', '):' · 최근 사용량 관측')+
    ' | 자료 생성: '+time(d.exportedAt);
}
const STATE_KO={RUNNING:'실행 중',VERIFYING:'검증 중',WAITING_USER:'확인 대기',FAILED:'실패',VERIFIED:'검증됨',STALE:'지연',BLOCKED:'막힘',QUEUED:'대기열'};
const PC_KO={OK:'정상',DELAYED:'수신 지연',LOST:'수신 끊김',WAITING:'측정 대기',NOT_CONNECTED:'미연결',ERROR:'측정 오류',UNKNOWN:'미확인'};
function renderControl(c){
  const root=$('control');root.replaceChildren();
  if(!c){root.append(el('section','card','PC 동기화에 관제판 요약이 아직 포함되지 않았어요.'));return;}
  (c.pcs||[]).forEach(p=>{
    const card=el('section','card');card.append(el('h2','',(p.label||p.id||'PC')+' · '+(PC_KO[p.state]||p.state||'미확인')));
    const cpu=el('div','line');cpu.append(el('span','label','CPU'),el('span','value',pct(p.cpuPct)+' (1시간 최고 '+pct(p.cpuMax1h)+')'));card.append(cpu);bar(card,p.cpuPct,85,95);
    const mem=el('div','line');mem.append(el('span','label','메모리'),el('span','value',pct(p.memPct)+' · 여유 '+num(p.memAvailGb,'GB')+' / '+num(p.memTotalGb,'GB')));card.append(mem);bar(card,p.memPct,85,93);
    (p.gpu||[]).forEach(g=>{const r=el('div','line');r.append(el('span','label','GPU '+(g.name||'')),el('span','value',pct(g.utilPct)+' · '+num(g.memUsedGb,'GB')+' / '+num(g.memTotalGb,'GB')));card.append(r);bar(card,g.utilPct,85,95);});
    card.append(el('div','meta',(p.role?p.role+' · ':'')+'측정: '+(time(p.measuredAt)||'미확인')+(p.alertCount?' · 경보 '+p.alertCount+'건':'')));
    root.append(card);
  });
  if(c.counts){const card=el('section','card');card.append(el('h2','','작업 현황'));const chips=el('div','chips');
    Object.keys(c.counts).filter(k=>k!=='total'&&c.counts[k]).forEach(k=>chips.append(el('span','chip',(STATE_KO[k]||k)+' '+c.counts[k])));
    card.append(chips);card.append(el('div','meta','전체 '+num(c.counts.total,'건')));root.append(card);}
  if(c.attention&&c.attention.length){const card=el('section','card');card.append(el('h2','','확인 필요 '+c.attention.length+'건'));
    c.attention.forEach(a=>{const i=el('div','item');i.append(el('b','',a.title||a.workId),el('div','',[a.workId,a.kind,a.projectId].filter(Boolean).join(' · ')));card.append(i);});root.append(card);}
  if(c.works&&c.works.length){const card=el('section','card');card.append(el('h2','','진행 중 업무'));
    c.works.forEach(w=>{const i=el('div','item');i.append(el('b','',(w.priority?'['+w.priority+'] ':'')+(w.title||w.workId)),el('div','',(STATE_KO[w.state]||w.state||'')+' · '+(w.workId||'')+(w.next?' · 다음: '+w.next:'')));card.append(i);});root.append(card);}
}
function render(answer){
  last=answer;const list=$('list');list.replaceChildren();status(answer);
  if(!answer||!answer.ok){renderControl(null);return;}
  const d=answer.data;
  renderControl(d.controlCenter);
  (d.providers||[]).filter(p=>!HIDDEN.includes(p.name)).forEach(p=>{
    const card=el('section','card'); card.append(el('h2','',p.name));
    if(p.name==='Claude Code'||p.name==='Codex CLI'){
      meter(card,'5시간 사용률',p.fiveHour);
      meter(card,'주간 사용률',p.week);
    }else if(p.month&&p.month.usedPercent!=null){
      meter(card,'월간 사용률',p.month);
    }
    if(p.name==='Netlify'&&Array.isArray(p.teams))p.teams.forEach(t=>{
      card.append(el('div','meta',(t.name||'팀')+' 월간 기본량: '+
        (t.monthlyUsed==null?'미확인':t.monthlyUsed)+' / '+(t.monthlyIncluded==null?'미확인':t.monthlyIncluded)));
    });
    const detail=p.observedAt?'관측: '+time(p.observedAt):'공식 사용량 미관측';
    card.append(el('div','meta',detail+(p.fresh===false?' · 이전 기록':'')));list.append(card);
  });
}
function load(){
  $('status').className='';$('status').textContent='사용량 확인 중…';
  google.script.run.withSuccessHandler(render).withFailureHandler(()=>{
    $('status').className='error';$('status').textContent='데이터 조회 실패';})
    .loadUsage();
}
load(); // On open; the refresh button is the only repeat trigger.
</script></body></html>
