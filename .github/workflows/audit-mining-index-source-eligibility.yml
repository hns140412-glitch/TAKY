name: Audit Mining Index Source Eligibility
on:
  push:
    branches: [audit/whole-system-cross-layer-20260928]
    paths:
      - 'ENFORCEMENT/mining_v2_index_scope_bridge.py'
      - 'ENFORCEMENT/tests/mining-v2-index-sufficiency-audit.py'
      - '.github/workflows/audit-mining-index-source-eligibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-eligibility-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hns140412-glitch/TAKY
          ref: 8e78af8b77d1f3e132f05c99cd6b69a7f258a23e
          path: canonical-main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: hns140412-glitch/TAKY
          ref: e6d5ec69ce693e36f5b3aaf9ac42f01d510959b6
          path: mining-v2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert both exact source heads
        run: |
          test "$(git -C canonical-main rev-parse HEAD)" = "8e78af8b77d1f3e132f05c99cd6b69a7f258a23e"
          test "$(git -C mining-v2 rev-parse HEAD)" = "e6d5ec69ce693e36f5b3aaf9ac42f01d510959b6"
      - name: Test main broker family and authority minimum before actual V2 Index bridge
        run: python ENFORCEMENT/tests/mining-v2-index-sufficiency-audit.py
