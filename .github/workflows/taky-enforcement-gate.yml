name: TAKY Enforcement Gate
on:
  push:
    paths:
      - 'MASTER/**'
      - 'ENFORCEMENT/**'
      - 'HISTORY/**'
      - '.github/workflows/taky-enforcement-gate.yml'
  pull_request:
    paths:
      - 'MASTER/**'
      - 'ENFORCEMENT/**'
      - 'HISTORY/**'
      - '.github/workflows/taky-enforcement-gate.yml'
jobs:
  enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate policy JSON
        run: python -m json.tool ENFORCEMENT/execution_policy.json >/dev/null
      - name: Replay historical enforcement regression
        working-directory: ENFORCEMENT
        run: python regression_readyset_2026_09_14.py
