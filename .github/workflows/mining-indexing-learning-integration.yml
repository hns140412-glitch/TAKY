name: TAKY Mining Indexing Learning Integration

on:
  push:
    branches:
      - taky/mining-indexing-learning-integration-2026-09-25
  pull_request:
    paths:
      - 'CURRENT/DATA/DATA_INDEX_SEARCH_PROJECTION.json'
      - 'MASTER/LEARNING_DATA_RUNTIME_POLICY_V1.json'
      - 'LEARNING/policy/**'
      - 'LEARNING/intake/indexed-evidence-handoff.js'
      - 'LEARNING/intake/indexed-evidence-handoff.test.js'
      - 'LEARNING/runtime/learning-engine-runtime.js'
      - 'LEARNING/runtime/learning-engine-runtime-policy.test.js'
      - 'ENFORCEMENT/reference_intake_executor.py'
      - 'ENFORCEMENT/reference_intake_executor_test.py'
      - 'ENFORCEMENT/runtime_orchestrator.py'

jobs:
  integration-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evidence policy bridge
        run: node LEARNING/policy/evidence-policy-bridge.test.js
      - name: Index to Learning evidence handoff
        run: node LEARNING/intake/indexed-evidence-handoff.test.js
      - name: Learning runtime policy integration
        run: node LEARNING/runtime/learning-engine-runtime-policy.test.js
      - name: Existing learner state regression
        run: node LEARNING/runtime/learner-state-core.test.js
      - name: Existing decision contract regression
        run: node LEARNING/runtime/decision-contract.test.js
      - name: Reference intake disposition lifecycle
        working-directory: ENFORCEMENT
        run: python reference_intake_executor_test.py
