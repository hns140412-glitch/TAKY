name: Audit Mining to Indexing Intake Boundary
on:
  push:
    branches: [audit/whole-system-cross-layer-20260928]
    paths:
      - 'ENFORCEMENT/mining_to_index_intake_guard.py'
      - 'ENFORCEMENT/tests/mining-to-index-intake-audit.py'
      - '.github/workflows/audit-mining-index-intake-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index-owner-receipt-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hns140412-glitch/TAKY
          ref: 8e78af8b77d1f3e132f05c99cd6b69a7f258a23e
          path: canonical-main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: hns140412-glitch/TAKY
          ref: e6d5ec69ce693e36f5b3aaf9ac42f01d510959b6
          path: mining-v2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent source commits
        run: |
          test "$(git -C canonical-main rev-parse HEAD)" = "8e78af8b77d1f3e132f05c99cd6b69a7f258a23e"
          test "$(git -C mining-v2 rev-parse HEAD)" = "e6d5ec69ce693e36f5b3aaf9ac42f01d510959b6"
      - name: Test actual screened V2 receipt to main Indexing-owned append-only lifecycle
        run: python ENFORCEMENT/tests/mining-to-index-intake-audit.py
