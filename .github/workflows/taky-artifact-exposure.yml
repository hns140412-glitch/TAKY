name: TAKY Artifact Exposure Gate

on:
  push:
    paths:
      - 'ENFORCEMENT/artifact_exposure_contract_validator.py'
      - 'ENFORCEMENT/artifact_exposure_contract_validator_test.py'
      - 'ENFORCEMENT/fixtures/artifact_exposure_*.json'
      - 'MASTER/ENFORCEMENT_PROTOCOL.md'
      - 'MASTER/HANDOFF_PROTOCOL.md'
      - '.github/workflows/taky-artifact-exposure.yml'
  pull_request:
    paths:
      - 'ENFORCEMENT/artifact_exposure_contract_validator.py'
      - 'ENFORCEMENT/artifact_exposure_contract_validator_test.py'
      - 'ENFORCEMENT/fixtures/artifact_exposure_*.json'
      - 'MASTER/ENFORCEMENT_PROTOCOL.md'
      - 'MASTER/HANDOFF_PROTOCOL.md'
      - '.github/workflows/taky-artifact-exposure.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ENFORCEMENT/artifact_exposure_contract_validator_test.py
