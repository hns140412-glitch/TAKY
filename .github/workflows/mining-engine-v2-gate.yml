jobs:
  mining-engine-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Mining Engine V2
        run: |
          python -m py_compile ENFORCEMENT/current_reconciler.py
          python -m py_compile ENFORCEMENT/anticipation_evaluator.py
          python -m py_compile ENFORCEMENT/strategy_failure_memory.py
          python -m py_compile ENFORCEMENT/mining_engine_step9_gate.py
          python -m py_compile ENFORCEMENT/mining_engine_step10_adversarial.py
          python -m py_compile ENFORCEMENT/mining_run_orchestrator.py
          python -m py_compile ENFORCEMENT/mining_engine_step12_unseen_goal.py
          python -m py_compile ENFORCEMENT/mining_core.py
          python -m py_compile ENFORCEMENT/mining_source_strategy.py
          python -m py_compile ENFORCEMENT/mining_claim_relations.py
          python -m py_compile ENFORCEMENT/mining_goal_sufficiency.py
          python -m py_compile ENFORCEMENT/mining_goal_decomposition.py
          python -m py_compile ENFORCEMENT/mining_depth_router.py
          python -m py_compile ENFORCEMENT/mining_external_adapter.py
          python -m py_compile ENFORCEMENT/mining_provider_executor.py
          python -m py_compile ENFORCEMENT/mining_provider_execution_loop.py
          python -m py_compile ENFORCEMENT/mining_live_execution.py
          python -m py_compile ENFORCEMENT/mining_live_execution_loop.py
          python -m py_compile ENFORCEMENT/mining_synthesis.py
          python -m py_compile ENFORCEMENT/mining_growth_loop.py
          python -m py_compile ENFORCEMENT/mining_e2e_benchmark.py
          python -m py_compile ENFORCEMENT/index_retrieval.py
          python -m py_compile ENFORCEMENT/mining_index_bridge.py
          python -m py_compile ENFORCEMENT/learning_index_bridge.py
          python -m py_compile ENFORCEMENT/learning_runtime.py
          python -m py_compile ENFORCEMENT/learning_orchestrator.py
          python -m py_compile ENFORCEMENT/learning_growth_memory.py
          python -m py_compile ENFORCEMENT/learning_mining_gap_loop.py
          python -m py_compile ENFORCEMENT/index_document_adapter.py
          python -m py_compile ENFORCEMENT/index_ingest_candidate.py
          python -m py_compile ENFORCEMENT/index_ingest_validator.py
          python -m py_compile ENFORCEMENT/external_to_learning_loop.py
      - name: Test CURRENT reconciler
        run: python ENFORCEMENT/current_reconciler_test.py
      - name: Test L5 anticipation evaluator
        run: python ENFORCEMENT/anticipation_evaluator_test.py
      - name: Test strategy and failure memory
        run: python ENFORCEMENT/strategy_failure_memory_test.py
      - name: Test unified Step 9 gate
        run: python ENFORCEMENT/mining_engine_step9_gate_test.py
      - name: Test Step 10 adversarial review
        run: python ENFORCEMENT/mining_engine_step10_adversarial_test.py
      - name: Test Step 11 mining run orchestrator
        run: python ENFORCEMENT/mining_run_orchestrator_test.py
      - name: Test Step 12 unseen-goal generalization
        run: python ENFORCEMENT/mining_engine_step12_unseen_goal_test.py
      - name: Test resumable Mining Core
        run: python ENFORCEMENT/mining_core_test.py
      - name: Test Mining source strategy
        run: python ENFORCEMENT/mining_source_strategy_test.py
      - name: Test semantic claim relations
        run: python ENFORCEMENT/mining_claim_relations_test.py
      - name: Test goal sufficiency stop
        run: python ENFORCEMENT/mining_goal_sufficiency_test.py
      - name: Test goal decomposition
        run: python ENFORCEMENT/mining_goal_decomposition_test.py
      - name: Test risk-aware depth routing
        run: python ENFORCEMENT/mining_depth_router_test.py
      - name: Test external mining adapter
        run: python ENFORCEMENT/mining_external_adapter_test.py
      - name: Test provider execution contract
        run: python ENFORCEMENT/mining_provider_executor_test.py
      - name: Test provider execution loop
        run: python ENFORCEMENT/mining_provider_execution_loop_test.py
      - name: Test live provider execution
        run: python ENFORCEMENT/mining_live_execution_test.py
      - name: Test live provider fallback loop
        run: python ENFORCEMENT/mining_live_execution_loop_test.py
      - name: Test evidence synthesis
        run: python ENFORCEMENT/mining_synthesis_test.py
      - name: Test outcome growth loop
        run: python ENFORCEMENT/mining_growth_loop_test.py
      - name: Test shared Index Retrieval Runtime
        run: python ENFORCEMENT/index_retrieval_test.py
      - name: Test Mining index-first bridge
        run: python ENFORCEMENT/mining_index_bridge_test.py
      - name: Test Learning shared index bridge
        run: python ENFORCEMENT/learning_index_bridge_test.py
      - name: Test central Learning Engine runtime
        run: python ENFORCEMENT/learning_runtime_test.py
      - name: Test Learning Engine orchestration
        run: python ENFORCEMENT/learning_orchestrator_test.py
      - name: Test Learning growth memory
        run: python ENFORCEMENT/learning_growth_memory_test.py
      - name: Test Learning-Mining evidence gap loop
        run: python ENFORCEMENT/learning_mining_gap_loop_test.py
      - name: Test actual 666-source index corpus E2E
        run: python ENFORCEMENT/index_actual_corpus_e2e_test.py
      - name: Test index ingest candidate adapter
        run: python ENFORCEMENT/index_ingest_candidate_test.py
      - name: Test index ingest validator
        run: python ENFORCEMENT/index_ingest_validator_test.py
      - name: Test external Mining to Index to Learning loop
        run: python ENFORCEMENT/external_to_learning_loop_test.py
      - name: Test heterogeneous E2E benchmark
        run: python ENFORCEMENT/mining_e2e_benchmark_test.py
      - name: Test live-captured heterogeneous E2E benchmark
        run: python ENFORCEMENT/mining_e2e_live_captured_test.py
