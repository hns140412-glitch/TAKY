name: Badge Visual Registry Validation

on:
  push:
    branches:
      - main
      - taky/badge-visual-binding-recovery-2026-09-26
    paths:
      - 'BADGE/**'
      - '.github/workflows/badge-visual-registry.yml'
  pull_request:
    paths:
      - 'BADGE/**'
      - '.github/workflows/badge-visual-registry.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check BADGE/badge-visual-registry.js
      - name: Registry guard regression
        run: node BADGE/badge-visual-registry.test.js
      - name: Renderer syntax check
        run: node --check BADGE/badge-visual-renderer.js
      - name: Renderer guard regression
        run: node BADGE/badge-visual-renderer.test.js
      - name: Reaward progression syntax
        run: node --check BADGE/badge-reaward-progress.js
      - name: Reaward progression regression
        run: node BADGE/badge-reaward-progress.test.js
      - name: Award Ledger bridge syntax
        run: node --check BADGE/badge-ledger-projection-bridge.js
      - name: Award Ledger bridge regression
        run: node BADGE/badge-ledger-projection-bridge.test.js
      - name: Durable Award Ledger syntax
        run: node --check BADGE/badge-award-ledger-store.js
      - name: Durable Award Ledger persisted replay
        run: node BADGE/badge-award-ledger-store.test.js
      - name: Verified ledger-to-visual syntax
        run: node --check BADGE/badge-ledger-visual-binding.js
      - name: Verified ledger-to-visual persisted integration
        run: node BADGE/badge-ledger-visual-binding.test.js
      - name: Family badge read access syntax
        run: node --check BADGE/badge-family-read-access.js
      - name: Verified family badge access regression
        run: node BADGE/badge-family-read-access.test.js
      - name: Parent praise gift syntax
        run: node --check BADGE/parent-praise-gift.js
      - name: Parent praise gift regression
        run: node BADGE/parent-praise-gift.test.js
      - name: Parent gift journal syntax
        run: node --check BADGE/parent-praise-gift-journal.js
      - name: Durable parent gift journal regression
        run: node BADGE/parent-praise-gift-journal.test.js
      - name: Family relationship-agnostic praise syntax
        run: node --check BADGE/family-praise-gift.js
      - name: Family gift journal V2 syntax
        run: node --check BADGE/family-praise-gift-journal.js
      - name: Authorized family giver and V2 journal regression
        run: node BADGE/family-praise-gift.test.js
      - name: 60 preset and 20 history discovery syntax
        run: node --check BADGE/badge-story-discovery.js
      - name: Story hierarchy and history discovery regression
        run: node BADGE/badge-story-discovery.test.js
      - name: Witty original badge copy validator syntax
        run: node --check BADGE/badge-wow-inspired-copy-validator.js
      - name: Witty 60+20 badge copy source preservation regression
        run: node BADGE/badge-wow-inspired-copy-validator.test.js
