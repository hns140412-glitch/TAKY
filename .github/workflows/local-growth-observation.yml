name: TAKY local growth observation candidate
on:
  pull_request:
    paths:
      - 'TOOLS/LOCAL_BRIDGE/growth_observer*'
      - 'TOOLS/LOCAL_BRIDGE/TAKY-GROWTH.ps1'
      - '.github/workflows/local-growth-observation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test explicit-scope observation and no source mutation
        run: python -m unittest discover -s TOOLS/LOCAL_BRIDGE -p "growth_observer_test.py" -v
      - name: Python parse verification
        run: python -m py_compile TOOLS/LOCAL_BRIDGE/growth_observer.py
  powershell-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse candidate script
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('TOOLS/LOCAL_BRIDGE/TAKY-GROWTH.ps1',[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw "TAKY-GROWTH parse failed: $errors" }
