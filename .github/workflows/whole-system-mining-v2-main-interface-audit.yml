name: Whole-System Mining V2 Main Interface Audit

on:
  push:
    branches: [audit/whole-system-cross-layer-20260928]
    paths:
      - '.github/workflows/whole-system-mining-v2-main-interface-audit.yml'
      - 'ENFORCEMENT/tests/mining-v2-main-contract-audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-interface-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated TAKY audit harness
        uses: actions/checkout@v4
      - name: Checkout authoritative central TAKY main snapshot
        uses: actions/checkout@v4
        with:
          repository: hns140412-glitch/TAKY
          ref: 8e78af8b77d1f3e132f05c99cd6b69a7f258a23e
          path: canonical-main
          persist-credentials: false
      - name: Checkout independently CLOSED Mining Engine V2 candidate tree
        uses: actions/checkout@v4
        with:
          repository: hns140412-glitch/TAKY
          ref: e6d5ec69ce693e36f5b3aaf9ac42f01d510959b6
          path: mining-v2
          persist-credentials: false
      - name: Enforce source exactness / no blind merge
        run: |
          test "$(git -C canonical-main rev-parse HEAD)" = "8e78af8b77d1f3e132f05c99cd6b69a7f258a23e"
          test "$(git -C mining-v2 rev-parse HEAD)" = "e6d5ec69ce693e36f5b3aaf9ac42f01d510959b6"
          test -f mining-v2/ENFORCEMENT/mining_run_orchestrator.py
          test -f canonical-main/ENFORCEMENT/learning_evidence_gap_broker.py
      - name: Use controlled Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise actual main Learning gap and separate Mining V2 plan contract
        run: python ENFORCEMENT/tests/mining-v2-main-contract-audit.py
