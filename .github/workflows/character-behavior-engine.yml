name: Character Behavior Engine Contract
on:
  pull_request:
    paths:
      - 'ENFORCEMENT/character_behavior_engine.py'
      - 'ENFORCEMENT/character_behavior_engine_test.py'
      - '.github/workflows/character-behavior-engine.yml'
  push:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest ENFORCEMENT/character_behavior_engine_test.py
      - run: python -m unittest ENFORCEMENT/relation_affinity_engine_test.py
      - run: python -m unittest ENFORCEMENT/runtime_eligibility_gate_test.py
      - run: python -m unittest ENFORCEMENT/scene_orchestrator_test.py
      - run: python -m unittest ENFORCEMENT/scene_policy_contract_test.py
      - run: python -m unittest ENFORCEMENT/app_scene_policy_adapter_test.py
      - run: python -m unittest ENFORCEMENT/character_scene_router_test.py
      - run: python -m unittest ENFORCEMENT/character_runtime_coordinator_test.py
      - run: python -m unittest ENFORCEMENT/character_runtime_receipt_test.py
      - run: python -m unittest ENFORCEMENT/ui_binding_contract_test.py
      - run: python -m unittest ENFORCEMENT/ui_binding_receipt_test.py
      - run: python -m unittest ENFORCEMENT/approved_asset_pointer_resolver_test.py
      - run: python -m unittest ENFORCEMENT/design_gate_receipt_test.py
      - run: python -m unittest ENFORCEMENT/asset_to_design_gate_integration_test.py
      - run: python -m unittest ENFORCEMENT/character_runtime_log_test.py
      - run: python -m unittest ENFORCEMENT/registry_version_contract_test.py
      - run: python -m unittest ENFORCEMENT/runtime_rollback_contract_test.py
      - run: python -m unittest ENFORCEMENT/specialist_pipeline_resume_test.py
      - run: python -m unittest ENFORCEMENT/specialist_asset_handoff_test.py
      - run: python -m unittest ENFORCEMENT/specialist_stage_receipt_test.py
      - run: python -m unittest ENFORCEMENT/specialist_stage_chain_test.py
      - run: python -m unittest ENFORCEMENT/specialist_recovery_decision_test.py
      - run: python -m unittest ENFORCEMENT/specialist_resume_authorization_test.py
      - run: python -m unittest ENFORCEMENT/cross_repo_asset_contract_test.py
      - run: python -m unittest ENFORCEMENT/explorer_crew_release_gate_test.py
      - run: python -m unittest ENFORCEMENT/explorer_crew_current_release_status_test.py
      - run: python -m unittest ENFORCEMENT/explorer_crew_contract_registry_validate_test.py
      - run: python -m unittest ENFORCEMENT/multi_character_scene_runtime_test.py
      - run: python -m unittest ENFORCEMENT/character_engine_integration_test.py
      - run: python -m unittest ENFORCEMENT/character_runtime_full_loop_test.py
