name: TAKY Enforcement Replay

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'TAKY.md'
      - 'ENFORCEMENT/**'
      - 'MASTER/CODEX_TASK_CONTRACT.md'
      - 'MASTER/OUTCOME_OPTIMIZATION_PROTOCOL.md'
      - 'MASTER/CONVERSATION_TO_SYSTEM_PROTOCOL.md'
      - 'MASTER/PROJECT_CONTEXT_MANIFEST_PROTOCOL.md'
      - 'PROJECTS/READY_SET_CONTEXT_MANIFEST.json'
      - 'HISTORY/2026-09-19_NOTEBOOKLM_PILOT01_SOURCE_REGISTRY.json'
      - 'MASTER/NOTEBOOKLM_SOURCE_SCHEMA.json'
      - 'MASTER/NOTEBOOKLM_RECOVERY_PROTOCOL.md'
      - 'MASTER/CONVERSATION_ATOM_SCHEMA.json'
      - 'MASTER/INTENT_EXECUTION_PROTOCOL.md'
      - 'MASTER/ENFORCEMENT_PROTOCOL.md'
      - 'MASTER/FAILURE_TAXONOMY.md'
      - 'MASTER/RULE_REGISTRY.json'
      - 'MASTER/HANDOFF_PROTOCOL.md'
      - 'MASTER/RECOVERY_FORENSICS_PROTOCOL.md'
      - 'MASTER/OPERATIONAL_WORKSPACE_PROTOCOL.md'
      - 'MASTER/VALIDATION_RULES.md'
      - 'OS/NOTION_OPS.md'
      - 'OS/C2S_RUNTIME_ACTIVATION.md'
      - 'DOMAIN/ARCHITECTURE_WORK_OS.md'
      - 'DOMAIN/ARCHITECTURE_GROWTH_MAP.md'
      - 'HISTORY/2026-09-19_ARCHITECTURE_C2S_LEDGER.json'
      - 'OS/COMMAND_INTERACTION.md'
      - '.github/workflows/taky-enforcement.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'TAKY.md'
      - 'ENFORCEMENT/**'
      - 'MASTER/CODEX_TASK_CONTRACT.md'
      - 'MASTER/OUTCOME_OPTIMIZATION_PROTOCOL.md'
      - 'MASTER/CONVERSATION_TO_SYSTEM_PROTOCOL.md'
      - 'MASTER/PROJECT_CONTEXT_MANIFEST_PROTOCOL.md'
      - 'PROJECTS/READY_SET_CONTEXT_MANIFEST.json'
      - 'HISTORY/2026-09-19_NOTEBOOKLM_PILOT01_SOURCE_REGISTRY.json'
      - 'MASTER/NOTEBOOKLM_SOURCE_SCHEMA.json'
      - 'MASTER/NOTEBOOKLM_RECOVERY_PROTOCOL.md'
      - 'MASTER/CONVERSATION_ATOM_SCHEMA.json'
      - 'MASTER/INTENT_EXECUTION_PROTOCOL.md'
      - 'MASTER/ENFORCEMENT_PROTOCOL.md'
      - 'MASTER/FAILURE_TAXONOMY.md'
      - 'MASTER/RULE_REGISTRY.json'
      - 'MASTER/HANDOFF_PROTOCOL.md'
      - 'MASTER/RECOVERY_FORENSICS_PROTOCOL.md'
      - 'MASTER/OPERATIONAL_WORKSPACE_PROTOCOL.md'
      - 'MASTER/VALIDATION_RULES.md'
      - 'OS/NOTION_OPS.md'
      - 'OS/C2S_RUNTIME_ACTIVATION.md'
      - 'DOMAIN/ARCHITECTURE_WORK_OS.md'
      - 'DOMAIN/ARCHITECTURE_GROWTH_MAP.md'
      - 'HISTORY/2026-09-19_ARCHITECTURE_C2S_LEDGER.json'
      - 'OS/COMMAND_INTERACTION.md'
      - '.github/workflows/taky-enforcement.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile enforcement tools
        run: |
          python -m py_compile ENFORCEMENT/taky_gate.py
          python -m py_compile ENFORCEMENT/rule_registry_lint.py
          python -m py_compile ENFORCEMENT/handoff_bundle_validator.py
          python -m py_compile ENFORCEMENT/evidence_ref_validator.py
          python -m py_compile ENFORCEMENT/preflight_bridge.py
          python -m py_compile ENFORCEMENT/evidence_bridge_regression.py
          python -m py_compile ENFORCEMENT/codex_task_contract_validator.py
          python -m py_compile ENFORCEMENT/conversation_coverage_validator.py
          python -m py_compile ENFORCEMENT/c2s_preflight_bridge.py
          python -m py_compile ENFORCEMENT/notebooklm_source_validator.py
          python -m py_compile ENFORCEMENT/project_context_validator.py
      - name: Lint rule ownership registry
        run: python ENFORCEMENT/rule_registry_lint.py
      - name: Replay baseline fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases.json
      - name: Replay enforcement v2 fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v2.json
      - name: Replay outcome optimization fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v3.json
      - name: Replay evidence-backed orchestration fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v4.json
      - name: Validate structured preflight evidence
        run: python ENFORCEMENT/preflight_bridge.py --record ENFORCEMENT/fixtures/preflight_evidence_pass.json --repo-root .
      - name: Replay evidence integrity failures
        run: python ENFORCEMENT/evidence_bridge_regression.py
      - name: Validate Codex task contract fixture
        run: python ENFORCEMENT/codex_task_contract_validator.py ENFORCEMENT/fixtures/codex_task_contract_pass.json
      - name: Validate self-contained handoff fixture
        run: python ENFORCEMENT/handoff_bundle_validator.py ENFORCEMENT/fixtures/handoff_bundle_pass
      - name: Validate conversation-to-system coverage fixture
        run: python ENFORCEMENT/conversation_coverage_validator.py ENFORCEMENT/fixtures/conversation_coverage_pass.json
      - name: Reject lossy conversation-to-system fixture
        run: |
          if python ENFORCEMENT/conversation_coverage_validator.py ENFORCEMENT/fixtures/conversation_coverage_fail.json; then
            echo "Expected failure fixture to be rejected"
            exit 1
          fi
          echo "Expected failure observed"
      - name: Validate C2S runtime bridge
        run: |
          python ENFORCEMENT/c2s_preflight_bridge.py \
            --record ENFORCEMENT/fixtures/c2s_runtime_preflight_pass.json \
            --coverage-record ENFORCEMENT/fixtures/conversation_coverage_pass.json \
            --repo-root .
      - name: Reject C2S runtime bridge without coverage
        run: |
          if python ENFORCEMENT/c2s_preflight_bridge.py \
            --record ENFORCEMENT/fixtures/c2s_runtime_preflight_pass.json \
            --repo-root .; then
            echo "Expected C2S runtime bridge to reject missing coverage"
            exit 1
          fi
          echo "Expected missing-coverage failure observed"
      - name: Reject C2S runtime bridge with lossy coverage
        run: |
          if python ENFORCEMENT/c2s_preflight_bridge.py \
            --record ENFORCEMENT/fixtures/c2s_runtime_preflight_pass.json \
            --coverage-record ENFORCEMENT/fixtures/conversation_coverage_fail.json \
            --repo-root .; then
            echo "Expected C2S runtime bridge to reject lossy coverage"
            exit 1
          fi
          echo "Expected lossy-coverage failure observed"
      - name: Validate architecture conversation C2S ledger
        run: python ENFORCEMENT/conversation_coverage_validator.py HISTORY/2026-09-19_ARCHITECTURE_C2S_LEDGER.json
      - name: Validate NotebookLM source registry fixture
        run: python ENFORCEMENT/notebooklm_source_validator.py ENFORCEMENT/fixtures/notebooklm_source_pass.json
      - name: Reject unsafe NotebookLM source fixture
        run: |
          if python ENFORCEMENT/notebooklm_source_validator.py ENFORCEMENT/fixtures/notebooklm_source_fail.json; then
            echo "Expected unsafe NotebookLM source fixture to be rejected"
            exit 1
          fi
          echo "Expected NotebookLM source-security failure observed"
      - name: Validate NotebookLM Pilot 01 source registry
        run: python ENFORCEMENT/notebooklm_source_validator.py HISTORY/2026-09-19_NOTEBOOKLM_PILOT01_SOURCE_REGISTRY.json

      - name: Validate Ready project context manifest
        run: |
          python ENFORCEMENT/project_context_validator.py \
            PROJECTS/READY_SET_CONTEXT_MANIFEST.json \
            --resolved ENFORCEMENT/fixtures/ready_set_context_resolved_pass.json
      - name: Reject incomplete Ready project context
        run: |
          if python ENFORCEMENT/project_context_validator.py \
            PROJECTS/READY_SET_CONTEXT_MANIFEST.json \
            --resolved ENFORCEMENT/fixtures/ready_set_context_resolved_fail.json; then
            echo "Expected incomplete Ready context to be rejected"
            exit 1
          fi
          echo "Expected Ready context failure observed"
