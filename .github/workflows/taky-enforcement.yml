permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile enforcement tools
        run: |
          python -m py_compile ENFORCEMENT/taky_gate.py
          python -m py_compile ENFORCEMENT/rule_registry_lint.py
          python -m py_compile ENFORCEMENT/handoff_bundle_validator.py
          python -m py_compile ENFORCEMENT/evidence_ref_validator.py
          python -m py_compile ENFORCEMENT/preflight_bridge.py
          python -m py_compile ENFORCEMENT/evidence_bridge_regression.py
          python -m py_compile ENFORCEMENT/codex_task_contract_validator.py
          python -m py_compile ENFORCEMENT/conversation_coverage_validator.py
          python -m py_compile ENFORCEMENT/c2s_preflight_bridge.py
          python -m py_compile ENFORCEMENT/c2s_semantic_boundary_regression.py
          python -m py_compile ENFORCEMENT/master_file_registry_validator.py
          python -m py_compile ENFORCEMENT/master_surface_integrity_validator.py
          python -m py_compile ENFORCEMENT/drive_storage_map_validator.py
          python -m py_compile ENFORCEMENT/mobile_app_development_registry_validator.py
          python -m py_compile ENFORCEMENT/system_layer_ownership_validator.py
          python -m py_compile ENFORCEMENT/shared_technical_capability_validator.py
          python -m py_compile ENFORCEMENT/current_product_identity_validator.py
          python -m py_compile ENFORCEMENT/runtime_orchestrator.py
          python -m py_compile ENFORCEMENT/behavioral_eval.py
          python -m py_compile ENFORCEMENT/trace_to_regression.py
          python -m py_compile ENFORCEMENT/execution_checkpoint.py
          python -m py_compile ENFORCEMENT/local_drive_workspace.py
          python -m py_compile ENFORCEMENT/data_index_search.py
          python -m py_compile ENFORCEMENT/codex_task_contract_builder.py
          python -m py_compile ENFORCEMENT/execution_state_engine.py
          python -m py_compile ENFORCEMENT/executor_review_loop.py
          python -m py_compile ENFORCEMENT/executor_transport.py
          python -m py_compile ENFORCEMENT/executor_adapter_registry.py
          python -m py_compile ENFORCEMENT/executor_result_ingest.py
          python -m py_compile ENFORCEMENT/executor_cycle.py
          python -m py_compile ENFORCEMENT/github_issue_executor_queue.py
          python -m py_compile ENFORCEMENT/github_queue_consumer.py
          python -m py_compile ENFORCEMENT/github_queue_poll_plan.py
          python -m py_compile ENFORCEMENT/conversation_continuity_validator.py
          python -m py_compile ENFORCEMENT/chatgpt_share_transcript_sanitizer.py
          python -m py_compile ENFORCEMENT/chatgpt_share_transcript_validator.py
          python -m py_compile ENFORCEMENT/notion_review_fresh_context_validator.py
          python -m py_compile ENFORCEMENT/drive_c2s_intake_validator.py
          python -m py_compile ENFORCEMENT/work_os_productive_router.py
          python -m py_compile ENFORCEMENT/review_result_c2s_validator.py
          python -m py_compile ENFORCEMENT/work_os_registry_validator.py
      - name: Lint rule ownership registry
        run: python ENFORCEMENT/rule_registry_lint.py
      - name: Validate MASTER file authority registry
        run: python ENFORCEMENT/master_file_registry_validator.py
      - name: Validate shared technical capability foundation
        run: python ENFORCEMENT/shared_technical_capability_validator.py
      - name: Validate system layer ownership map
        run: python ENFORCEMENT/system_layer_ownership_validator.py
      - name: Validate independent Learning Engine Core V2
        run: node LEARNING/runtime/learner-state-core.test.js
      - name: Validate retention state baseline candidate
        run: node LEARNING/estimators/retention-state-baseline.test.js
      - name: Validate declared concept dependency graph
        run: node LEARNING/domain-model/concept-dependency-graph.test.js
      - name: Validate data-derived relation promotion policy
        run: node LEARNING/domain-model/relation-promotion-policy.test.js
      - name: Validate calibrated BKT candidate
        run: node LEARNING/estimators/bkt-calibration-candidate.test.js
      - name: Validate metacognitive self-reflection evidence
        run: node LEARNING/evidence/self-reflection-evidence.test.js
      - name: Validate item-scoped learning recovery profile
        run: node LEARNING/runtime/recovery-profile.test.js
      - name: Validate unified Learning Engine runtime decision contract
        run: node LEARNING/runtime/decision-contract.test.js
      - name: Validate pedagogical feedback intent
        run: node LEARNING/pedagogy/feedback-intent.test.js
      - name: Validate adaptive learning plan intent
        run: node LEARNING/pedagogy/adaptive-plan-contract.test.js
      - name: Validate Learning Engine estimator benchmark lane
        run: node LEARNING/benchmark/estimator-benchmark.test.js
      - name: Validate estimator promotion policy
        run: node LEARNING/benchmark/promotion-policy.test.js
      - name: Validate estimator promotion report
        run: node LEARNING/benchmark/promotion-report.test.js
      - name: Validate lossless Learning Engine evaluation ledger
        run: node LEARNING/lifecycle/evaluation-ledger.test.js
      - name: Validate Learning Engine reevaluation orchestrator
        run: node LEARNING/lifecycle/evaluation-orchestrator.test.js
      - name: Validate automatic real-evidence evaluation trigger
        run: node LEARNING/lifecycle/real-evidence-evaluation-trigger.test.js
      - name: Validate estimator data readiness snapshot
        run: node LEARNING/lifecycle/estimator-data-readiness.test.js
      - name: Validate Learning Engine data readiness current
        run: node LEARNING/lifecycle/data-readiness-current.test.js
      - name: Validate no-loss Learning Engine change ledger
        run: node LEARNING/lifecycle/change-ledger.test.js
      - name: Validate retained Learning Engine change ledger CURRENT
        run: node LEARNING/lifecycle/change-ledger-current.test.js
      - name: Validate Learning Engine replay dataset contract
        run: node LEARNING/replay/replay-dataset.test.js
      - name: Validate Learning Engine replay benchmark bridge
        run: node LEARNING/replay/replay-benchmark.test.js
      - name: Validate real learning evidence receipt pipeline
        run: node LEARNING/receipts/real-evidence-receipt.test.js
      - name: Validate skill-scoped real evidence intake
        run: node LEARNING/intake/real-evidence-intake.test.js
      - name: Validate cumulative specialist evidence intake pipeline
        run: node LEARNING/intake/specialist-event-pipeline.test.js
      - name: Validate central evidence transport ingest handler
        run: node LEARNING/intake/transport-handler.test.js
      - name: Validate durable evidence store adapter
        run: node LEARNING/transport/durable-evidence-store-adapter.test.js
      - name: Validate central authenticated evidence HTTP boundary and committed receipt ACK
        run: |
          node --check LEARNING/transport/central-learning-http-endpoint.js
          node LEARNING/transport/central-learning-http-endpoint.test.js
          node LEARNING/transport/durable-evidence-commit-ack.test.js
      - name: Validate Google subject and server membership + real Node central learning HTTP bridge
        run: |
          node --check LEARNING/transport/google-learning-principal.js
          node --check LEARNING/transport/node-http-learning-bridge.js
          node LEARNING/transport/google-node-central-integration.test.js
          node --check LEARNING/transport/server-family-registry-provider.js
          node --check LEARNING/transport/server-family-registry-provider.test.js
          node LEARNING/transport/server-family-registry-provider.test.js
          node --check LEARNING/transport/central-google-node-host.js
          node --check LEARNING/transport/central-google-node-host.test.js
          node LEARNING/transport/central-google-node-host.test.js
          node --check LEARNING/transport/server-specialist-verifier.js
          node --check LEARNING/transport/server-specialist-verifier.test.js
          node LEARNING/transport/server-specialist-verifier.test.js
          node --check LEARNING/transport/server-specialist-reference-store.js
          node --check LEARNING/transport/server-specialist-reference-store.test.js
          node LEARNING/transport/server-specialist-reference-store.test.js
          node --check LEARNING/transport/central-store-conformance.js
          node --check LEARNING/transport/central-store-conformance.test.js
          node LEARNING/transport/central-store-conformance.test.js
          node --check LEARNING/transport/pwa-central-evidence-ack-client.js
          node --check LEARNING/transport/pwa-central-evidence-ack-client.test.js
          node LEARNING/transport/pwa-central-evidence-ack-client.test.js
          node --check LEARNING/transport/scoped-evidence-outbox.js
          node --check LEARNING/transport/scoped-evidence-outbox.test.js
          node LEARNING/transport/scoped-evidence-outbox.test.js
          node --check LEARNING/transport/indexeddb-evidence-outbox-store.js
          node --check LEARNING/transport/indexeddb-evidence-outbox-store.test.js
          node LEARNING/transport/indexeddb-evidence-outbox-store.test.js
          node --check LEARNING/transport/pwa-scoped-evidence-pipeline.js
          node --check LEARNING/transport/pwa-scoped-evidence-pipeline.test.js
          node LEARNING/transport/pwa-scoped-evidence-pipeline.test.js
          node --check LEARNING/transport/specialist-observation-packet-mapper.js
          node LEARNING/transport/specialist-observation-packet-mapper.test.js
          node --check LEARNING/transport/build-browser-evidence-bundle.js
          node LEARNING/transport/build-browser-evidence-bundle.test.js
          node --check LEARNING/transport/specialist-bridge-event-adapter.js
          node LEARNING/transport/specialist-bridge-event-adapter.test.js
          node --check LEARNING/transport/encrypted-drive-archive-export.js
          node --check LEARNING/transport/encrypted-drive-archive-export.test.js
          node LEARNING/transport/encrypted-drive-archive-export.test.js
      - name: Validate learning transport auth policy
        run: node LEARNING/transport/transport-auth-policy.test.js
      - name: Validate authenticated evidence transport
        run: node LEARNING/transport/authenticated-evidence-transport.test.js
      - name: Validate Netlify Blobs transport adapter
        run: node LEARNING/transport/netlify-blobs-transport-adapter.test.js
      - name: Validate central Learning versus Drive archive routing
        run: |
          node --check LEARNING/transport/drive-archive-route.js
          node LEARNING/transport/drive-archive-route.test.js
      - name: Validate server transport kernel reconciliation
        run: node LEARNING/transport/server-transport-kernel.test.js
      - name: Validate Learning Engine verification layer
        run: node LEARNING/verification/verification-layer.test.js
      - name: Validate app-specific verifier policy
        run: node LEARNING/verification/verifier-policy.test.js
      - name: Validate canonical Learning Evidence adapters
        run: node LEARNING/adapters/canonical-evidence.test.js
      - name: Validate canonical evidence into replay labels
        run: node LEARNING/replay/canonical-evidence-replay.test.js
      - name: Validate Learning Engine replay dataset contract
        run: node LEARNING/data/replay-dataset-builder.test.js
      - name: Validate Learning Engine evidence normalizer
        run: node LEARNING/data/evidence-normalizer.test.js
      - name: Validate MASTER structural integrity and active projection
        run: python ENFORCEMENT/master_surface_integrity_validator.py
      - name: Validate Drive storage role map
        run: python ENFORCEMENT/drive_storage_map_validator.py
      - name: Validate mobile app development registry
        run: python ENFORCEMENT/mobile_app_development_registry_validator.py
      - name: Validate current product identity
        run: python ENFORCEMENT/current_product_identity_validator.py
      - name: Validate Notion review V2.1 freshness ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('HISTORY/2026-09-20_NOTION_REVIEW_C2S_V2_1_LEDGER.json')
          d=json.loads(p.read_text())
          s=d['summary']
          assert s['material_item_count']==39
          assert s['mapped_material_item_count']==39
          assert s['unmapped_material_item_count']==0
          assert s['silent_loss_count']==0
          assert s['review_result_without_owner']==0
          assert s['review_result_without_action']==0
          assert s['review_result_without_utilization_state']==0
          ids={x['id'] for x in d['freshness_patch']}
          assert ids=={'C2S-NWR2-018','C2S-NWR2-019','C2S-NWR2-039'}
          for x in d['freshness_patch']:
            for k in ('owner','disposition','utilization_state','action_ref','next_action','verification_status'):
              assert str(x.get(k,'')).strip(), (x['id'],k)
          assert d['live_baseline']['ready_device_verified'] is False
          assert d['live_baseline']['ready_production_verified'] is False
          PY
      - name: Validate live Notion timetable structure inspection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('HISTORY/2026-09-20_NOTION_TIMETABLE_STRUCTURE_INSPECTION.json').read_text())
          assert d['atom_id']=='C2S-NWR2-037'
          assert d['target_database']['active_row_count']==12
          assert d['confirmed_defect']['row_count']==0
          assert d['confirmed_defect']['classification']=='CONFIRMED_EMPTY_DUPLICATE_DATA_SOURCE'
          assert d['cleanup_attempt']['result']=='TOOL_BLOCKED'
          assert d['cleanup_attempt']['active_source_modified'] is False
          assert d['c2s_result']['reflection_gap_closed'] is True
          assert d['c2s_result']['cleanup_complete'] is False
          assert d['coverage']['unmapped_material']==0
          assert d['coverage']['silent_loss']==0
          PY
      - name: Validate direct Drive C2S intake
        run: python ENFORCEMENT/drive_c2s_intake_validator.py ENFORCEMENT/fixtures/drive_c2s_intake_pass.json
      - name: Validate direct Drive C2S compile closure with reflection still open
        run: python ENFORCEMENT/drive_c2s_intake_validator.py ENFORCEMENT/fixtures/drive_c2s_compile_closed_pass.json
      - name: Validate Work OS reusable and volatile registries
        run: |
          python ENFORCEMENT/work_os_registry_validator.py \
            --recipe OS/ASSET_SKILL_RECIPE_REGISTRY.json \
            --capability OS/VOLATILE_CAPABILITY_REGISTRY.json
      - name: Validate Work OS productive routing
        run: |
          python ENFORCEMENT/work_os_productive_router.py ENFORCEMENT/fixtures/work_os_router_pipeline.json > /tmp/work-pipeline.json
          python ENFORCEMENT/work_os_productive_router.py ENFORCEMENT/fixtures/work_os_router_idea.json > /tmp/work-idea.json
          python ENFORCEMENT/work_os_productive_router.py ENFORCEMENT/fixtures/work_os_router_visual.json > /tmp/work-visual.json
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/work-pipeline.json').read_text())['route']['next_stage']=='VERIFY'
          assert json.loads(Path('/tmp/work-idea.json').read_text())['route']['destination']=='_LAB'
          assert json.loads(Path('/tmp/work-idea.json').read_text())['route']['canonical'] is False
          assert json.loads(Path('/tmp/work-visual.json').read_text())['route']['visualization']=='FLOW_DIAGRAM'
          PY
      - name: Reject incomplete Work OS idea routing
        run: |
          if python ENFORCEMENT/work_os_productive_router.py ENFORCEMENT/fixtures/work_os_router_fail.json; then
            echo "Expected incomplete idea record to fail"
            exit 1
          fi
          echo "Expected Work OS router failure observed"
      - name: Reject NotebookLM-dependent direct C2S intake
        run: |
          if python ENFORCEMENT/drive_c2s_intake_validator.py ENFORCEMENT/fixtures/drive_c2s_intake_fail.json; then
            echo "Expected NotebookLM-dependent intake to be rejected"
            exit 1
          fi
          echo "Expected direct Drive C2S dependency failure observed"
      - name: Replay baseline fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases.json
      - name: Replay enforcement v2 fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v2.json
      - name: Replay outcome optimization fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v3.json
      - name: Replay evidence-backed orchestration fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v4.json
      - name: Replay generic pre-action rule-application fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v5.json
      - name: Replay production authority and no-pass-no-show fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v6.json
      - name: Validate fresh-context Notion review routing
        run: python ENFORCEMENT/notion_review_fresh_context_validator.py ENFORCEMENT/fixtures/notion_review_fresh_context_pass.json --repo-root .
      - name: Reject fresh-context Notion structure-substitution regression
        run: |
          if python ENFORCEMENT/notion_review_fresh_context_validator.py ENFORCEMENT/fixtures/notion_review_fresh_context_fail.json --repo-root .; then
            echo "Expected fresh-context Notion regression fixture to be rejected"
            exit 1
          fi
          echo "Expected fresh-context Notion routing failure observed"
      - name: Validate structured preflight evidence
        run: python ENFORCEMENT/preflight_bridge.py --record ENFORCEMENT/fixtures/preflight_evidence_pass.json --repo-root .
      - name: Validate controlled runtime orchestrator
        run: python ENFORCEMENT/runtime_orchestrator.py --record ENFORCEMENT/fixtures/runtime_orchestrator_pass.json --repo-root .

      - name: Runtime hardening focused regressions
        working-directory: ENFORCEMENT
        run: |
          python change_preserve_contract_test.py
          python execution_outcome_state_test.py
          python approval_checkpoint_resume_test.py
          python execution_state_approval_binding_test.py
          python untrusted_reader_quarantine_test.py
          python context_firewall_test.py
