name: TAKY Enforcement Replay

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'TAKY.md'
      - 'ENFORCEMENT/**'
      - 'MASTER/CODEX_TASK_CONTRACT.md'
      - 'MASTER/EXECUTOR_TRANSPORT_SCHEMA.json'
      - 'OS/GITHUB_EXECUTOR_QUEUE.md'
      - 'MASTER/EXECUTOR_TRANSPORT_SCHEMA.json'
      - 'OS/GITHUB_EXECUTOR_QUEUE.md'
      - 'MASTER/OUTCOME_OPTIMIZATION_PROTOCOL.md'
      - 'MASTER/CONVERSATION_TO_SYSTEM_PROTOCOL.md'
      - 'HISTORY/2026-09-19_NOTEBOOKLM_PILOT01_SOURCE_REGISTRY.json'
      - 'MASTER/NOTEBOOKLM_SOURCE_SCHEMA.json'
      - 'MASTER/NOTEBOOKLM_RECOVERY_PROTOCOL.md'
      - 'MASTER/CONVERSATION_CONTINUITY_SCHEMA.json'
      - 'MASTER/CONVERSATION_CONTINUITY_PROTOCOL.md'
      - 'MASTER/CONVERSATION_ATOM_SCHEMA.json'
      - 'MASTER/INTENT_EXECUTION_PROTOCOL.md'
      - 'MASTER/ENFORCEMENT_PROTOCOL.md'
      - 'MASTER/FAILURE_TAXONOMY.md'
      - 'MASTER/RULE_REGISTRY.json'
      - 'MASTER/HANDOFF_PROTOCOL.md'
      - 'MASTER/RECOVERY_FORENSICS_PROTOCOL.md'
      - 'MASTER/OPERATIONAL_WORKSPACE_PROTOCOL.md'
      - 'MASTER/VALIDATION_RULES.md'
      - 'MASTER/UI_REFERENCE_PROTOCOL.md'
      - 'MASTER/UI_REFERENCE_REGISTRY.json'
      - 'MASTER/UI_REFERENCE_COMPARISON_MATRIX.json'
      - 'PROJECTS/READY_WHOLE_IMPLEMENTATION_CONTRACT.md'
      - 'OS/NOTION_OPS.md'
      - 'OS/C2S_RUNTIME_ACTIVATION.md'
      - 'DOMAIN/ARCHITECTURE_WORK_OS.md'
      - 'DOMAIN/ARCHITECTURE_GROWTH_MAP.md'
      - 'HISTORY/2026-09-19_ARCHITECTURE_C2S_LEDGER.json'
      - 'OS/COMMAND_INTERACTION.md'
      - '.github/workflows/taky-enforcement.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'TAKY.md'
      - 'ENFORCEMENT/**'
      - 'MASTER/CODEX_TASK_CONTRACT.md'
      - 'MASTER/OUTCOME_OPTIMIZATION_PROTOCOL.md'
      - 'MASTER/CONVERSATION_TO_SYSTEM_PROTOCOL.md'
      - 'HISTORY/2026-09-19_NOTEBOOKLM_PILOT01_SOURCE_REGISTRY.json'
      - 'MASTER/NOTEBOOKLM_SOURCE_SCHEMA.json'
      - 'MASTER/NOTEBOOKLM_RECOVERY_PROTOCOL.md'
      - 'MASTER/CONVERSATION_CONTINUITY_SCHEMA.json'
      - 'MASTER/CONVERSATION_CONTINUITY_PROTOCOL.md'
      - 'MASTER/CONVERSATION_ATOM_SCHEMA.json'
      - 'MASTER/INTENT_EXECUTION_PROTOCOL.md'
      - 'MASTER/ENFORCEMENT_PROTOCOL.md'
      - 'MASTER/FAILURE_TAXONOMY.md'
      - 'MASTER/RULE_REGISTRY.json'
      - 'MASTER/HANDOFF_PROTOCOL.md'
      - 'MASTER/RECOVERY_FORENSICS_PROTOCOL.md'
      - 'MASTER/OPERATIONAL_WORKSPACE_PROTOCOL.md'
      - 'MASTER/VALIDATION_RULES.md'
      - 'OS/NOTION_OPS.md'
      - 'OS/C2S_RUNTIME_ACTIVATION.md'
      - 'DOMAIN/ARCHITECTURE_WORK_OS.md'
      - 'DOMAIN/ARCHITECTURE_GROWTH_MAP.md'
      - 'HISTORY/2026-09-19_ARCHITECTURE_C2S_LEDGER.json'
      - 'OS/COMMAND_INTERACTION.md'
      - '.github/workflows/taky-enforcement.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile enforcement tools
        run: |
          python -m py_compile ENFORCEMENT/taky_gate.py
          python -m py_compile ENFORCEMENT/rule_registry_lint.py
          python -m py_compile ENFORCEMENT/handoff_bundle_validator.py
          python -m py_compile ENFORCEMENT/evidence_ref_validator.py
          python -m py_compile ENFORCEMENT/preflight_bridge.py
          python -m py_compile ENFORCEMENT/evidence_bridge_regression.py
          python -m py_compile ENFORCEMENT/codex_task_contract_validator.py
          python -m py_compile ENFORCEMENT/conversation_coverage_validator.py
          python -m py_compile ENFORCEMENT/c2s_preflight_bridge.py
          python -m py_compile ENFORCEMENT/runtime_orchestrator.py
          python -m py_compile ENFORCEMENT/codex_task_contract_builder.py
          python -m py_compile ENFORCEMENT/execution_state_engine.py
          python -m py_compile ENFORCEMENT/executor_review_loop.py
          python -m py_compile ENFORCEMENT/executor_transport.py
          python -m py_compile ENFORCEMENT/executor_result_ingest.py
          python -m py_compile ENFORCEMENT/executor_cycle.py
          python -m py_compile ENFORCEMENT/github_issue_executor_queue.py
          python -m py_compile ENFORCEMENT/notebooklm_source_validator.py
          python -m py_compile ENFORCEMENT/conversation_continuity_validator.py
          python -m py_compile ENFORCEMENT/chatgpt_share_transcript_sanitizer.py
          python -m py_compile ENFORCEMENT/chatgpt_share_transcript_validator.py
          python -m py_compile ENFORCEMENT/notion_review_fresh_context_validator.py
      - name: Lint rule ownership registry
        run: python ENFORCEMENT/rule_registry_lint.py
      - name: Replay baseline fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases.json
      - name: Replay enforcement v2 fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v2.json
      - name: Replay outcome optimization fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v3.json
      - name: Replay evidence-backed orchestration fixtures
        run: python ENFORCEMENT/taky_gate.py --replay ENFORCEMENT/replay_cases_v4.json
      - name: Validate fresh-context Notion review routing
        run: python ENFORCEMENT/notion_review_fresh_context_validator.py ENFORCEMENT/fixtures/notion_review_fresh_context_pass.json --repo-root .
      - name: Reject fresh-context Notion structure-substitution regression
        run: |
          if python ENFORCEMENT/notion_review_fresh_context_validator.py ENFORCEMENT/fixtures/notion_review_fresh_context_fail.json --repo-root .; then
            echo "Expected fresh-context Notion regression fixture to be rejected"
            exit 1
          fi
          echo "Expected fresh-context Notion routing failure observed"
      - name: Validate structured preflight evidence
        run: python ENFORCEMENT/preflight_bridge.py --record ENFORCEMENT/fixtures/preflight_evidence_pass.json --repo-root .
      - name: Validate controlled runtime orchestrator
        run: python ENFORCEMENT/runtime_orchestrator.py --record ENFORCEMENT/fixtures/runtime_orchestrator_pass.json --repo-root .
      - name: Validate generated Codex task contract
        run: |
          python ENFORCEMENT/runtime_orchestrator.py --record ENFORCEMENT/fixtures/runtime_orchestrator_pass.json --repo-root . > /tmp/runtime.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/runtime.json').read_text())
          contract=data.get('task_contract')
          assert contract, 'task_contract missing'
          Path('/tmp/generated_contract.json').write_text(json.dumps(contract, ensure_ascii=False, indent=2)+'\n')
          PY
          python ENFORCEMENT/codex_task_contract_validator.py /tmp/generated_contract.json
      - name: Validate REWORK state transition
        run: python ENFORCEMENT/execution_state_engine.py ENFORCEMENT/fixtures/execution_state_rework_pass.json
      - name: Validate successful executor review
        run: python ENFORCEMENT/executor_review_loop.py --task ENFORCEMENT/fixtures/executor_review_task.json --report ENFORCEMENT/fixtures/executor_review_pass.json
      - name: Validate GitHub Issue queue formatter/parser
        run: |
          python ENFORCEMENT/executor_transport.py build --task ENFORCEMENT/fixtures/executor_review_task.json --transport GITHUB_ISSUE_QUEUE --output /tmp/github-envelope.json
          python ENFORCEMENT/github_issue_executor_queue.py issue --envelope /tmp/github-envelope.json --output /tmp/github-issue.json
          python - <<'PY'
          import json
          from pathlib import Path
          issue=json.loads(Path('/tmp/github-issue.json').read_text())
          assert issue['title'].startswith('[TAKY EXECUTOR QUEUE]')
          assert 'TAKY_EXECUTOR_DISPATCH_JSON_BEGIN' in issue['body']
          env=json.loads(Path('/tmp/github-envelope.json').read_text())
          receipt={
            'task_id':env['task_id'],
            'provider':env['provider'],
            'task_contract_sha256':env['task_contract_sha256'],
            'executor_run_id':'fixture-run-001',
            'status':'ACCEPTED'
          }
          comment='<!-- TAKY_EXECUTOR_RECEIPT_JSON_BEGIN -->\n'+json.dumps(receipt)+'\n<!-- TAKY_EXECUTOR_RECEIPT_JSON_END -->\n'
          Path('/tmp/github-comment.txt').write_text(comment)
          PY
          python ENFORCEMENT/github_issue_executor_queue.py parse-comment --comment /tmp/github-comment.txt > /tmp/parsed-comment.json
          python - <<'PY'
          import json
          from pathlib import Path
          env=json.loads(Path('/tmp/github-envelope.json').read_text())
          parsed=json.loads(Path('/tmp/parsed-comment.json').read_text())
          assert parsed['receipt']['task_id']==env['task_id']
          Path('/tmp/receipt.json').write_text(json.dumps(parsed['receipt'], indent=2)+'\n')
          PY
          python ENFORCEMENT/executor_transport.py verify-receipt --envelope /tmp/github-envelope.json --receipt /tmp/receipt.json
      - name: Validate executor transport and closed review cycle
        run: |
          python ENFORCEMENT/executor_transport.py build --task ENFORCEMENT/fixtures/executor_review_task.json --output /tmp/envelope.json
          python - <<'PY'
          import json
          from pathlib import Path
          env=json.loads(Path('/tmp/envelope.json').read_text())
          report=json.loads(Path('ENFORCEMENT/fixtures/executor_review_pass.json').read_text())
          result={
            "task_id": env["task_id"],
            "provider": env["provider"],
            "task_contract_sha256": env["task_contract_sha256"],
            "completion_report": report,
          }
          Path('/tmp/executor_result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2)+'\n')
          bad=dict(result)
          bad["task_contract_sha256"]="0"*64
          Path('/tmp/executor_result_bad.json').write_text(json.dumps(bad, ensure_ascii=False, indent=2)+'\n')
          PY
          python ENFORCEMENT/executor_result_ingest.py --envelope /tmp/envelope.json --result /tmp/executor_result.json
          python ENFORCEMENT/executor_cycle.py --envelope /tmp/envelope.json --result /tmp/executor_result.json
          if python ENFORCEMENT/executor_result_ingest.py --envelope /tmp/envelope.json --result /tmp/executor_result_bad.json; then
            echo "Expected mismatched executor result hash to be rejected"
            exit 1
          fi
          echo "Expected executor-result integrity failure observed"
      - name: Validate failed executor result returns to REWORK through cycle
        run: |
          python ENFORCEMENT/executor_transport.py build --task ENFORCEMENT/fixtures/executor_review_task.json --output /tmp/envelope-fail.json
          python - <<'PY'
          import json
          from pathlib import Path
          env=json.loads(Path('/tmp/envelope-fail.json').read_text())
          report=json.loads(Path('ENFORCEMENT/fixtures/executor_review_fail.json').read_text())
          result={
            "task_id": env["task_id"],
            "provider": env["provider"],
            "task_contract_sha256": env["task_contract_sha256"],
            "completion_report": report,
          }
          Path('/tmp/executor_result_fail.json').write_text(json.dumps(result, ensure_ascii=False, indent=2)+'\n')
          PY
          python ENFORCEMENT/executor_cycle.py --envelope /tmp/envelope-fail.json --result /tmp/executor_result_fail.json > /tmp/cycle-fail.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/cycle-fail.json').read_text())
          assert data["review"]["review_decision"] == "REWORK"
          assert data["transition"]["current_state"] == "REWORK"
          assert data["next_action"] == "RETURN_REWORK_TO_EXECUTOR"
          PY
      - name: Route failed executor review to REWORK
        run: |
          if python ENFORCEMENT/executor_review_loop.py --task ENFORCEMENT/fixtures/executor_review_task.json --report ENFORCEMENT/fixtures/executor_review_fail.json; then
            echo "Expected failed executor evidence to require REWORK"
            exit 1
          fi
          python ENFORCEMENT/executor_review_loop.py --task ENFORCEMENT/fixtures/executor_review_task.json --report ENFORCEMENT/fixtures/executor_review_fail.json > /tmp/review.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/review.json').read_text())
          assert data.get('review_decision') == 'REWORK'
          transition=data.get('state_transition') or {}
          transition['defects']=data.get('defects', [])
          transition['acceptance_delta']=data.get('acceptance_delta', [])
          Path('/tmp/rework_transition.json').write_text(json.dumps(transition, ensure_ascii=False, indent=2)+'\n')
          PY
          python ENFORCEMENT/execution_state_engine.py /tmp/rework_transition.json
      - name: Reject forbidden state shortcut
        run: |
          if python ENFORCEMENT/execution_state_engine.py ENFORCEMENT/fixtures/execution_state_shortcut_fail.json; then
            echo "Expected forbidden state shortcut to be rejected"
            exit 1
          fi
          echo "Expected forbidden transition failure observed"
      - name: Reject runtime without operational assimilation
        run: |
          if python ENFORCEMENT/runtime_orchestrator.py --record ENFORCEMENT/fixtures/runtime_orchestrator_fail.json --repo-root .; then
            echo "Expected runtime orchestrator to block missing working model"
            exit 1
          fi
          echo "Expected runtime working-model failure observed"
      - name: Replay evidence integrity failures
        run: python ENFORCEMENT/evidence_bridge_regression.py
      - name: Validate Codex task contract fixture
        run: python ENFORCEMENT/codex_task_contract_validator.py ENFORCEMENT/fixtures/codex_task_contract_pass.json
      - name: Validate self-contained handoff fixture
        run: python ENFORCEMENT/handoff_bundle_validator.py ENFORCEMENT/fixtures/handoff_bundle_pass
      - name: Validate conversation-to-system coverage fixture
        run: python ENFORCEMENT/conversation_coverage_validator.py ENFORCEMENT/fixtures/conversation_coverage_pass.json
      - name: Reject lossy conversation-to-system fixture
        run: |
          if python ENFORCEMENT/conversation_coverage_validator.py ENFORCEMENT/fixtures/conversation_coverage_fail.json; then
            echo "Expected failure fixture to be rejected"
            exit 1
          fi
          echo "Expected failure observed"
      - name: Validate C2S runtime bridge
        run: |
          python ENFORCEMENT/c2s_preflight_bridge.py \
            --record ENFORCEMENT/fixtures/c2s_runtime_preflight_pass.json \
            --coverage-record ENFORCEMENT/fixtures/conversation_coverage_pass.json \
            --repo-root .
      - name: Reject C2S runtime bridge without coverage
        run: |
          if python ENFORCEMENT/c2s_preflight_bridge.py \
            --record ENFORCEMENT/fixtures/c2s_runtime_preflight_pass.json \
            --repo-root .; then
            echo "Expected C2S runtime bridge to reject missing coverage"
            exit 1
          fi
          echo "Expected missing-coverage failure observed"
      - name: Reject C2S runtime bridge with lossy coverage
        run: |
          if python ENFORCEMENT/c2s_preflight_bridge.py \
            --record ENFORCEMENT/fixtures/c2s_runtime_preflight_pass.json \
            --coverage-record ENFORCEMENT/fixtures/conversation_coverage_fail.json \
            --repo-root .; then
            echo "Expected C2S runtime bridge to reject lossy coverage"
            exit 1
          fi
          echo "Expected lossy-coverage failure observed"
      - name: Validate architecture conversation C2S ledger
        run: python ENFORCEMENT/conversation_coverage_validator.py HISTORY/2026-09-19_ARCHITECTURE_C2S_LEDGER.json
      - name: Validate NotebookLM source registry fixture
        run: python ENFORCEMENT/notebooklm_source_validator.py ENFORCEMENT/fixtures/notebooklm_source_pass.json
      - name: Reject unsafe NotebookLM source fixture
        run: |
          if python ENFORCEMENT/notebooklm_source_validator.py ENFORCEMENT/fixtures/notebooklm_source_fail.json; then
            echo "Expected unsafe NotebookLM source fixture to be rejected"
            exit 1
          fi
          echo "Expected NotebookLM source-security failure observed"
      - name: Validate NotebookLM Pilot 01 source registry
        run: python ENFORCEMENT/notebooklm_source_validator.py HISTORY/2026-09-19_NOTEBOOKLM_PILOT01_SOURCE_REGISTRY.json
      - name: Validate lightweight conversation continuity
        run: python ENFORCEMENT/conversation_continuity_validator.py ENFORCEMENT/fixtures/conversation_continuity_pass.json
      - name: Validate targeted historical recovery
        run: python ENFORCEMENT/conversation_continuity_validator.py ENFORCEMENT/fixtures/conversation_continuity_targeted_pass.json
      - name: Reject recoverable-context re-ask
        run: |
          if python ENFORCEMENT/conversation_continuity_validator.py ENFORCEMENT/fixtures/conversation_continuity_reask_fail.json; then
            echo "Expected ASK LAST violation to be rejected"
            exit 1
          fi
          echo "Expected recoverable-context re-ask failure observed"
      - name: Reject unnecessary full-history load
        run: |
          if python ENFORCEMENT/conversation_continuity_validator.py ENFORCEMENT/fixtures/conversation_continuity_heavy_fail.json; then
            echo "Expected FULL SCAN LAST violation to be rejected"
            exit 1
          fi
          echo "Expected unnecessary full-scan failure observed"
      - name: Validate saved-share transcript sanitization
        run: |
          python ENFORCEMENT/chatgpt_share_transcript_sanitizer.py ENFORCEMENT/fixtures/chatgpt_share_fixture.html -o /tmp/share.md
          python ENFORCEMENT/chatgpt_share_transcript_validator.py /tmp/share.md
          diff -u ENFORCEMENT/fixtures/chatgpt_share_expected.md /tmp/share.md
      - name: Reject unsafe sanitized transcript
        run: |
          if python ENFORCEMENT/chatgpt_share_transcript_validator.py ENFORCEMENT/fixtures/chatgpt_share_unsafe.md; then
            echo "Expected unsafe transcript to be rejected"
            exit 1
          fi
          echo "Expected unsafe transcript failure observed"
