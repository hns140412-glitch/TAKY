name: SOURCE VAULT Handoff Bridge
on:
  pull_request:
    paths:
      - 'ENFORCEMENT/source_vault_handoff_bridge.py'
      - 'ENFORCEMENT/source_vault_handoff_bridge_test.py'
      - '.github/workflows/source-vault-handoff.yml'
  push:
    branches:
      - 'feat/source-vault-handoff-bridge-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-routing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed router bridge regressions (no credentials or network)
        run: python -m unittest discover -s ENFORCEMENT -p 'source_vault_handoff_bridge_test.py' -v
